<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявки — Majestic Admin</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --discord: #5865F2; --bg: #0d0e10; --bg2: #131416; --bg3: #1a1b1e; --bg4: #222327; --border: rgba(255,255,255,0.07); --text: #f0f0f2; --muted: #6b6d78; --sw: 260px; }
  body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  #sidebar { position: fixed; top: 0; left: 0; width: var(--sw); height: 100vh; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 100; transition: transform .3s cubic-bezier(.4,0,.2,1); }
  #sidebar.collapsed { transform: translateX(calc(-1 * var(--sw))); }
  .sb-header { padding: 22px 18px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .sb-logo { width: 38px; height: 38px; background: var(--discord); border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sb-logo svg { width: 22px; height: 22px; fill: white; }
  .sb-title { font-size: 15px; font-weight: 800; }
  .sb-sub { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .sb-nav { flex: 1; padding: 14px 10px; overflow-y: auto; }
  .nav-label { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; padding: 10px 10px 5px; font-family: 'JetBrains Mono', monospace; }
  .nav-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 2px; transition: background .15s, color .15s; text-decoration: none; }
  .nav-item:hover { background: var(--bg4); color: var(--text); }
  .nav-item.active { background: rgba(88,101,242,0.15); color: #818cf8; }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .75; }
  .nav-item.active svg { opacity: 1; }
  .nav-badge { margin-left: auto; background: #ed4245; color: white; font-size: 10px; font-weight: 700; border-radius: 20px; padding: 2px 7px; font-family: 'JetBrains Mono', monospace; }
  .sb-user { padding: 14px 16px; border-top: 1px solid var(--border); background: var(--bg3); display: flex; align-items: center; gap: 11px; }
  .u-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--discord); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: white; flex-shrink: 0; border: 2px solid rgba(88,101,242,.35); overflow: hidden; }
  .u-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .u-info { flex: 1; min-width: 0; }
  .u-nick { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .u-role-badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 20px; font-family: 'JetBrains Mono', monospace; font-weight: 600; margin-top: 3px; }
  .u-logout { background: none; border: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 8px; transition: background .15s, color .15s; display: flex; }
  .u-logout:hover { background: var(--bg4); color: var(--text); }
  .u-logout svg { width: 16px; height: 16px; }
  #main { margin-left: var(--sw); transition: margin-left .3s cubic-bezier(.4,0,.2,1); min-height: 100vh; }
  #main.expanded { margin-left: 0; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 18px 28px; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 50; }
  .toggle-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: 10px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s; flex-shrink: 0; }
  .toggle-btn:hover { background: var(--bg4); }
  .toggle-btn svg { width: 18px; height: 18px; }
  .topbar-title { font-size: 17px; font-weight: 800; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .topbar-tag { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-family: 'JetBrains Mono', monospace; color: var(--muted); }
  .content { padding: 28px 32px; }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-btn { background: var(--bg2); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 7px 14px; font-size: 12px; font-family: 'JetBrains Mono', monospace; cursor: pointer; transition: all .15s; }
  .filter-btn:hover { border-color: rgba(88,101,242,.4); color: var(--text); }
  .filter-btn.active { background: rgba(88,101,242,.15); border-color: rgba(88,101,242,.4); color: #818cf8; }
  .apps-list { display: flex; flex-direction: column; gap: 12px; }
  .app-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 20px 24px; transition: border-color .15s; }
  .app-card:hover { border-color: rgba(255,255,255,.12); }
  .app-card.pending { border-left: 3px solid #5865F2; }
  .app-card.accepted { border-left: 3px solid #3ba55c; }
  .app-card.accepted_rp { border-left: 3px solid #57f287; }
  .app-card.rejected { border-left: 3px solid #ed4245; }
  .app-card.interview { border-left: 3px solid #faa61a; }
  .app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .app-name { font-size: 16px; font-weight: 800; }
  .app-age { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .app-status { margin-left: auto; font-size: 11px; padding: 3px 10px; border-radius: 20px; font-family: 'JetBrains Mono', monospace; font-weight: 700; border: 1px solid; flex-shrink: 0; }
  .status-pending { background: rgba(88,101,242,.15); color: #818cf8; border-color: rgba(88,101,242,.3); }
  .status-accepted { background: rgba(59,165,92,.15); color: #3ba55c; border-color: rgba(59,165,92,.3); }
  .status-accepted_rp { background: rgba(87,242,135,.15); color: #57f287; border-color: rgba(87,242,135,.3); }
  .status-rejected { background: rgba(237,66,69,.15); color: #ed4245; border-color: rgba(237,66,69,.3); }
  .status-interview { background: rgba(250,166,26,.15); color: #faa61a; border-color: rgba(250,166,26,.3); }
  .app-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .app-field { background: var(--bg3); border-radius: 8px; padding: 10px 14px; }
  .app-field-label { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
  .app-field-value { font-size: 13px; font-weight: 600; }
  .app-field-full { background: var(--bg3); border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
  .app-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .action-btn { padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace; cursor: pointer; border: 1px solid; transition: all .15s; }
  .btn-accept { background: rgba(59,165,92,.15); color: #3ba55c; border-color: rgba(59,165,92,.3); }
  .btn-accept:hover { background: rgba(59,165,92,.25); }
  .btn-accept-rp { background: rgba(87,242,135,.15); color: #57f287; border-color: rgba(87,242,135,.3); }
  .btn-accept-rp:hover { background: rgba(87,242,135,.25); }
  .btn-reject { background: rgba(237,66,69,.15); color: #ed4245; border-color: rgba(237,66,69,.3); }
  .btn-reject:hover { background: rgba(237,66,69,.25); }
  .btn-interview { background: rgba(250,166,26,.15); color: #faa61a; border-color: rgba(250,166,26,.3); }
  .btn-interview:hover { background: rgba(250,166,26,.25); }
  .btn-delete { background: rgba(255,255,255,.05); color: var(--muted); border-color: var(--border); margin-left: auto; }
  .btn-delete:hover { background: rgba(237,66,69,.1); color: #ed4245; border-color: rgba(237,66,69,.3); }
  .app-date { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 4px; }
  .empty-state { text-align: center; padding: 64px; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--discord); border-radius: 50%; animation: spin .8s linear infinite; margin: 48px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 90; }
  .apply-link { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; font-size: 12px; font-family: 'JetBrains Mono', monospace; color: #818cf8; text-decoration: none; white-space: nowrap; }
  .apply-link:hover { border-color: rgba(88,101,242,.4); }
</style>
</head>
<body>
<div id="overlay" onclick="closeSidebar()"></div>
<nav id="sidebar">
  <div class="sb-header">
    <div class="sb-logo"><svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.031.056a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg></div>
    <div><div class="sb-title">Family Hub</div><div class="sb-sub">// admin panel</div></div>
  </div>
  <div class="sb-nav">
    <div class="nav-label">Главное</div>
    <a class="nav-item" href="/panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Дашборд</a>
    <a class="nav-item" href="/panel/members"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Участники</a>
    <a class="nav-item active" href="/panel/applications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>Заявки<span class="nav-badge" id="pending-count"></span></a>
    <a class="nav-item" href="/panel/roles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>Роли</a>
    <a class="nav-item" href="/panel/logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Логи</a>
    <div class="nav-label" style="margin-top:8px;">Система</div>
    <a class="nav-item" href="/panel/settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Настройки</a>
  </div>
  <div class="sb-user">
    <div class="u-avatar" id="sb-avatar">?</div>
    <div class="u-info">
      <div class="u-nick" id="sb-nick">Загрузка...</div>
      <div class="u-role-badge" id="sb-role">—</div>
    </div>
    <button class="u-logout" onclick="logout()" title="Выйти"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
  </div>
</nav>
<div id="main">
  <div class="topbar">
    <button class="toggle-btn" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <span class="topbar-title">Заявки</span>
    <div class="topbar-right">
      <a class="apply-link" href="/apply" target="_blank">// ссылка на форму заявки</a>
      <span class="topbar-tag">Family Server</span>
    </div>
  </div>
  <div class="content">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterApps('all', this)">Все</button>
      <button class="filter-btn" onclick="filterApps('pending', this)">Ожидают</button>
      <button class="filter-btn" onclick="filterApps('accepted', this)">Принятые</button>
      <button class="filter-btn" onclick="filterApps('accepted_rp', this)">Принятые на РП</button>
      <button class="filter-btn" onclick="filterApps('interview', this)">На обзвон</button>
      <button class="filter-btn" onclick="filterApps('rejected', this)">Отклонённые</button>
    </div>
    <div class="apps-list" id="apps-list"><div class="spinner"></div></div>
  </div>
</div>
<script>
const API = 'https://majestic-family-admin-u0ze.onrender.com';
let sidebarOpen = true;
let allApps = [];
let activeFilter = 'all';

function hex(c) { return c ? '#' + c.toString(16).padStart(6,'0') : '#5865F2'; }
function initials(n) { return (n||'?').slice(0,2).toUpperCase(); }
function getToken() { return localStorage.getItem('authToken'); }

const statusLabels = { pending: 'Ожидает', accepted: 'Принят', accepted_rp: 'Принят на РП', rejected: 'Отклонён', interview: 'На обзвон' };

async function init() {
  const token = getToken();
  if (!token) { window.location.href = '/'; return; }
  try {
    const res = await fetch(`${API}/auth/me?token=${token}`);
    if (!res.ok) { localStorage.removeItem('authToken'); window.location.href = '/'; return; }
    const user = await res.json();
    const nick = user.nick || user.username;
    const topColor = user.topRole ? hex(user.topRole.color) : '#5865F2';
    const topName = user.topRole ? user.topRole.name : 'Участник';
    document.getElementById('sb-nick').textContent = nick;
    const rb = document.getElementById('sb-role');
    rb.textContent = topName; rb.style.background = topColor+'33'; rb.style.color = topColor;
    const av = document.getElementById('sb-avatar');
    av.innerHTML = user.avatar ? `<img src="${user.avatar}" alt="${nick}">` : initials(nick);
    av.style.borderColor = topColor+'66';
    loadApps();
  } catch { window.location.href = '/'; }
}

async function loadApps() {
  const token = getToken();
  try {
    const res = await fetch(`${API}/api/applications?token=${token}`);
    if (!res.ok) return;
    allApps = await res.json();
    const pending = allApps.filter(a => a.status === 'pending').length;
    const badge = document.getElementById('pending-count');
    if (pending > 0) { badge.textContent = pending; badge.style.display = 'inline'; }
    else badge.style.display = 'none';
    renderApps(allApps);
  } catch {}
}

function filterApps(status, btn) {
  activeFilter = status;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = status === 'all' ? allApps : allApps.filter(a => a.status === status);
  renderApps(filtered);
}

function renderApps(apps) {
  const c = document.getElementById('apps-list');
  if (!apps.length) { c.innerHTML = '<div class="empty-state">// заявок нет</div>'; return; }
  c.innerHTML = apps.map(a => {
    const date = new Date(a.created_at).toLocaleString('ru-RU');
    return `<div class="app-card ${a.status}" id="app-${a.id}">
      <div class="app-header">
        <div>
          <div class="app-name">${a.name}</div>
          <div class="app-age">// ${a.age} лет</div>
        </div>
        <span class="app-status status-${a.status}">${statusLabels[a.status] || a.status}</span>
      </div>
      <div class="app-fields">
        <div class="app-field"><div class="app-field-label">Время на Маджестике</div><div class="app-field-value">${a.time_on_majestic}</div></div>
        <div class="app-field"><div class="app-field-label">Часов в день</div><div class="app-field-value">${a.hours_per_day}</div></div>
        ${a.shooting_stats ? `<div class="app-field"><div class="app-field-label">Откат стрельбы</div><div class="app-field-value">${a.shooting_stats}</div></div>` : ''}
      </div>
      <div class="app-field-full"><div class="app-field-label">Другие семьи</div><div class="app-field-value" style="margin-top:4px;font-weight:400;font-size:13px;color:var(--muted)">${a.other_families || 'Нет'}</div></div>
      <div class="app-date">// подана: ${date}</div>
      <div class="app-actions">
        <button class="action-btn btn-accept" onclick="updateStatus(${a.id}, 'accepted')">✅ Принять</button>
        <button class="action-btn btn-accept-rp" onclick="updateStatus(${a.id}, 'accepted_rp')">🎮 Принять на РП</button>
        <button class="action-btn btn-interview" onclick="updateStatus(${a.id}, 'interview')">📞 Вызвать на обзвон</button>
        <button class="action-btn btn-reject" onclick="updateStatus(${a.id}, 'rejected')">❌ Отклонить</button>
        <button class="action-btn btn-delete" onclick="deleteApp(${a.id})">🗑 Удалить</button>
      </div>
    </div>`;
  }).join('');
}

async function updateStatus(id, status) {
  const token = getToken();
  try {
    const res = await fetch(`${API}/api/applications/${id}?token=${token}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    if (res.ok) {
      const app = allApps.find(a => a.id === id);
      if (app) app.status = status;
      const filtered = activeFilter === 'all' ? allApps : allApps.filter(a => a.status === activeFilter);
      renderApps(filtered);
      const pending = allApps.filter(a => a.status === 'pending').length;
      const badge = document.getElementById('pending-count');
      if (pending > 0) { badge.textContent = pending; badge.style.display = 'inline'; }
      else badge.style.display = 'none';
    }
  } catch {}
}

async function deleteApp(id) {
  if (!confirm('Удалить заявку?')) return;
  const token = getToken();
  try {
    const res = await fetch(`${API}/api/applications/${id}?token=${token}`, { method: 'DELETE' });
    if (res.ok) {
      allApps = allApps.filter(a => a.id !== id);
      const filtered = activeFilter === 'all' ? allApps : allApps.filter(a => a.status === activeFilter);
      renderApps(filtered);
    }
  } catch {}
}

async function logout() {
  const token = getToken();
  if (token) await fetch(`${API}/auth/logout?token=${token}`);
  localStorage.removeItem('authToken');
  window.location.href = '/';
}

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
  document.getElementById('main').classList.toggle('expanded', !sidebarOpen);
}
function closeSidebar() {
  sidebarOpen = false;
  document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('main').classList.add('expanded');
  document.getElementById('overlay').style.display = 'none';
}

init();
</script>
</body>
