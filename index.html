<!DOCTYPE html>
<html lang="ru">

<meta charset="UTF-8">

<title>Majestic Admin — Вход</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --discord: #5865F2; --discord-h: #4752C4; --bg: #0d0e10; --bg2: #131416; --border: rgba(255,255,255,0.07); --text: #f0f0f2; --muted: #6b6d78; }
  body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 52px 48px; width: 420px; text-align: center; }
  .login-logo { width: 64px; height: 64px; background: var(--discord); border-radius: 18px; margin: 0 auto 28px; display: flex; align-items: center; justify-content: center; }
  .login-logo svg { width: 36px; height: 36px; fill: white; }
  h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  p { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 36px; font-family: 'JetBrains Mono', monospace; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 12px; background: var(--discord); color: white; border-radius: 12px; padding: 15px 28px; font-size: 15px; font-weight: 600; font-family: 'Syne', sans-serif; width: 100%; text-decoration: none; transition: background .2s; }
  .btn:hover { background: var(--discord-h); }
  .btn svg { width: 22px; height: 22px; fill: white; }
  .note { margin-top: 18px; font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .error { background: rgba(237,66,69,.1); border: 1px solid rgba(237,66,69,.3); border-radius: 12px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px; color: #ed4245; font-family: 'JetBrains Mono', monospace; display: none; }
</style>
</head>
<body>
